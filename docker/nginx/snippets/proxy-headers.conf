# ブラウザが接続したホスト名とポートを、転送先へ渡す。
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;

# ブラウザ→Nginxの通信方式を渡す。今回はhttps。
proxy_set_header X-Forwarded-Proto $scheme;

# ブラウザが接続した公開ポートを渡す。今回は3000。
proxy_set_header X-Forwarded-Port $public_port;

# Nginxから見える接続元IPを渡す。
# ブラウザが送ってきた同名ヘッダーは、確認した値で上書きする。
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;

# 別形式の転送情報が混ざらないよう、このヘッダーは渡さない。
proxy_set_header Forwarded "";

# Origin、Cookie、Content-Typeは通常どおり中継する。
# Originを設定値で上書きせず、API側で送信元を検査できるようにする。