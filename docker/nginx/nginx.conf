# SaaSの構成を小さく再現するポートフォリオ。
# 今回はNginxをHTTP・HTTPSの入口として使用する。
# 以下の接続数は開発用の初期値で、対応人数を保証する値ではない。
# 規模を広げる際は負荷試験を行い、資源・接続数・台数を調整する。

# 通信を処理するワーカー数を、利用できるCPUに合わせて自動決定する。
worker_processes auto;
# Nginxのメインプロセスの番号を、書き込み可能な場所へ記録する。
pid /tmp/nginx.pid;

events {
    # 1ワーカー当たりの同時接続上限。
    # ブラウザとの接続と、転送先への接続を両方含む。
    worker_connections 512;
}

# HTTP・HTTPSの通信に共通する設定。
http {
    # ファイルの拡張子と、ブラウザへ伝える種類の対応表を読み込む。
    include /etc/nginx/mime.types;

    # 種類を決められない場合は、汎用のバイナリデータとして扱う。
    default_type application/octet-stream;
    # ブラウザから受け取る要求本文の一時保存先。
    client_body_temp_path /tmp/client_temp;

    # 転送先から受け取る応答を、一時保存する場合の保存先。
    proxy_temp_path /tmp/proxy_temp;

    # その他の内蔵通信方式の一時保存先も、/tmp配下へそろえる。
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # templateから生成した、ポートやURL振り分けの設定を読み込む。
    include /etc/nginx/conf.d/*.conf;
}